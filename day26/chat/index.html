<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>День 26 — Локальный чат (Ollama)</title>
<style>
  * { box-sizing: border-box; }
  :root { color-scheme: dark; }
  html, body { height: 100%; }
  body {
    margin: 0; background: #0e0f11; color: #edeef0;
    font-family: 'Segoe UI', system-ui, sans-serif;
    display: flex; flex-direction: column; height: 100vh;
  }
  header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 20px; border-bottom: 1px solid #2a2d31; background: #101215;
    flex-wrap: wrap; gap: 10px;
  }
  h1 { font-size: 20px; margin: 0; }
  .sub { color: #9ba1a6; font-size: 13px; margin: 2px 0 0; }
  .hright { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .badge {
    display: flex; align-items: center; gap: 8px;
    background: #12211a; border: 1px solid #24553c; color: #8fe3c0;
    border-radius: 999px; padding: 6px 12px; font-size: 12px; font-weight: 600;
    white-space: nowrap;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #8fe3c0; }
  .dot.ok { background: #8fe3c0; animation: pulse 1.8s infinite; }
  .dot.bad { background: #f26d6d; animation: none; }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(143,227,192,.5); }
    70%  { box-shadow: 0 0 0 8px rgba(143,227,192,0); }
    100% { box-shadow: 0 0 0 0 rgba(143,227,192,0); }
  }
  select {
    background: #15171a; color: #edeef0; border: 1px solid #2a2d31;
    border-radius: 8px; padding: 7px 10px; font-size: 13px;
  }
  .banner {
    background: #1a150a; border-bottom: 1px solid #3a2f12;
    color: #f5c451; padding: 8px 20px; font-size: 12.5px;
  }
  .banner code { background: #241d0c; border-radius: 4px; padding: 1px 5px; color: #f5c451; }
  main { flex: 1; overflow-y: auto; padding: 20px; }
  .msg { display: flex; margin: 0 0 14px; }
  .msg.user { justify-content: flex-end; }
  .msg.assistant { justify-content: flex-start; }
  .bubble {
    max-width: 78%; border-radius: 14px; padding: 10px 14px;
    font-size: 14.5px; line-height: 1.55;
  }
  .msg.user .bubble { background: #24413a; border: 1px solid #2f5647; }
  .msg.assistant .bubble { background: #15171a; border: 1px solid #2a2d31; }
  .meta { font-size: 11px; color: #9ba1a6; margin: 0 0 4px; }
  .msg.assistant .meta { color: #8fe3c0; }
  .body { white-space: pre-wrap; word-break: break-word; }
  .body p { margin: 0 0 8px; }
  .body p:last-child { margin: 0; }
  .body pre {
    background: #0b0c0e; border: 1px solid #2a2d31; border-radius: 8px;
    padding: 10px 12px; overflow-x: auto; font-size: 13px; margin: 8px 0;
  }
  .body code {
    font-family: Consolas, monospace; background: #0b0c0e;
    border: 1px solid #2a2d31; border-radius: 4px; padding: 1px 5px; color: #cfe9df; font-size: .9em;
  }
  .body pre code { border: none; padding: 0; background: transparent; }
  .body.thinking { color: #9ba1a6; font-style: italic; }
  footer {
    display: flex; gap: 8px; padding: 12px 20px;
    border-top: 1px solid #2a2d31; background: #101215;
  }
  textarea {
    flex: 1; resize: none; background: #15171a; color: #edeef0;
    border: 1px solid #2a2d31; border-radius: 10px; padding: 10px 12px;
    font-family: inherit; font-size: 14.5px; max-height: 160px;
  }
  button {
    background: #f5c451; color: #1a150a; border: none; border-radius: 10px;
    padding: 0 18px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  button.ghost { background: #15171a; color: #9ba1a6; border: 1px solid #2a2d31; }
  button:hover { filter: brightness(1.06); }
</style>
</head>
<body>

<header>
  <div>
    <h1>Локальный чат</h1>
    <p class="sub">День 26 · модель крутится на вашем компьютере, без облака</p>
  </div>
  <div class="hright">
    <div class="badge"><span class="dot" id="statusDot"></span><span id="statusText">подключение…</span></div>
    <select id="modelSelect" title="Модель"></select>
  </div>
</header>

<div class="banner">
  🖥️ <b>ЛОКАЛЬНАЯ МОДЕЛЬ</b> — все запросы идут на <code>http://localhost:11434</code> (Ollama).
  Ничего не уходит в облако, интернет не используется.
</div>

<main id="messages"></main>

<footer>
  <textarea id="input" rows="1" placeholder="Напишите сообщение… (Enter — отправить, Shift+Enter — новая строка)"></textarea>
  <button id="send">Отправить</button>
  <button id="clear" class="ghost">Новая беседа</button>
</footer>

<script>
  const API = 'http://localhost:11434';
  let currentModel = 'gemma4:12b';
  let history = []; // {role, content}

  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const clearBtn = document.getElementById('clear');
  const modelSelect = document.getElementById('modelSelect');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');

  function setStatus(ok, text) {
    statusDot.className = 'dot ' + (ok ? 'ok' : 'bad');
    statusText.textContent = text;
  }

  async function loadModels() {
    try {
      const res = await fetch(API + '/api/tags');
      const data = await res.json();
      const models = data.models || [];
      modelSelect.innerHTML = '';
      models.forEach(m => {
        const opt = document.createElement('option');
        const ps = m.details && m.details.parameter_size ? m.details.parameter_size : '';
        opt.value = m.name;
        opt.textContent = m.name + (ps ? ' · ' + ps : '');
        modelSelect.appendChild(opt);
      });
      if (models.length) currentModel = models[0].name;
    } catch (e) { /* noop */ }
  }

  async function ping() {
    try {
      const res = await fetch(API + '/api/version');
      if (!res.ok) throw new Error();
      setStatus(true, 'онлайн · ' + API);
    } catch (e) {
      setStatus(false, 'офлайн — запустите Ollama');
    }
  }

  function renderMarkdown(src) {
    let esc = src.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    esc = esc.replace(/```([^\n]*)\n([\s\S]*?)```/g, function (m, lang, code) {
      return '<pre><code>' + code.replace(/\n$/, '') + '</code></pre>';
    });
    esc = esc.replace(/`([^`\n]+)`/g, '<code>$1</code>');
    esc = esc.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
    const paras = esc.split(/\n{2,}/).map(p => p.trim()).filter(Boolean)
      .map(p => '<p>' + p.replace(/\n/g, '<br>') + '</p>');
    return paras.join('');
  }

  function addMessage(role, text) {
    const wrap = document.createElement('div');
    wrap.className = 'msg ' + role;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = role === 'user' ? 'вы' : ('🤖 ' + currentModel + ' · локально');
    const body = document.createElement('div');
    body.className = 'body';
    if (text) body.textContent = text;
    bubble.appendChild(meta);
    bubble.appendChild(body);
    wrap.appendChild(bubble);
    messagesEl.appendChild(wrap);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return body;
  }

  async function send() {
    const text = inputEl.value.trim();
    if (!text) return;
    inputEl.value = '';
    addMessage('user', text);
    history.push({ role: 'user', content: text });

    const bodyEl = addMessage('assistant', '');
    const metaEl = bodyEl.parentElement.querySelector('.meta');
    const started = performance.now();
    let full = '';

    try {
      const res = await fetch(API + '/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ model: currentModel, messages: history, stream: true })
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buf = '';
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        let nl;
        while ((nl = buf.indexOf('\n')) >= 0) {
          const line = buf.slice(0, nl).trim();
          buf = buf.slice(nl + 1);
          if (!line) continue;
          let obj; try { obj = JSON.parse(line); } catch (e) { continue; }
          const msg = obj && obj.message ? obj.message : null;
          const delta = msg ? (msg.content || '') : '';
          const isThinking = msg ? !!msg.thinking : false;
          if (delta) {
            full += delta;
            bodyEl.classList.remove('thinking');
            bodyEl.textContent = full;
          } else if (isThinking && !full) {
            bodyEl.classList.add('thinking');
            bodyEl.textContent = '…думает…';
          }
          messagesEl.scrollTop = messagesEl.scrollHeight;
        }
      }
      history.push({ role: 'assistant', content: full });
      const secs = ((performance.now() - started) / 1000).toFixed(1);
      metaEl.textContent = '🤖 ' + currentModel + ' · локально · ' + secs + ' с';
      if (full) bodyEl.innerHTML = renderMarkdown(full);
      setStatus(true, 'онлайн · ' + API);
    } catch (e) {
      bodyEl.textContent = '⚠️ Не удалось получить ответ: ' + e.message + '. Проверьте, что Ollama запущен.';
      metaEl.textContent = '🤖 ' + currentModel + ' · локально · ошибка';
      setStatus(false, 'офлайн — запустите Ollama');
    }
  }

  sendBtn.addEventListener('click', send);
  inputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });
  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + 'px';
  });
  clearBtn.addEventListener('click', () => { history = []; messagesEl.innerHTML = ''; });
  modelSelect.addEventListener('change', () => { currentModel = modelSelect.value; });

  loadModels();
  ping();
</script>
</body>
</html>
